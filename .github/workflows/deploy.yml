
name: Publish Fuze to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Publish Fuze to user GitHub Pages repository
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/godestalbin/godestalbin.github.io.git destination
          cp *.html destination/
          mv destination/Fuze.html destination/index.html
          cp *.css destination/
          cp *.png destination/
          cp -r js/. destination/js
          cd destination
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy Fuze"
          git push
